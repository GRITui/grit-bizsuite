<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Grit Taskboard</title>
<meta name="description" content="Ops kanban with event-driven card automation — task tracking for Grit BizSuite.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF8F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grit Taskboard">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>(function(){var K='sidekick_ui_theme',t=localStorage.getItem(K);if(t==='dark')document.documentElement.dataset.theme='dark';else if(t!=='auto')document.documentElement.dataset.theme='light';})();</script><!-- light by default: set before CSS paints to avoid a flash of the wrong theme -->
<link rel="stylesheet" href="styles.css?v=0.9.38">
<!-- data-page absent/non-login → boot() runs bootApp() (redirects to login.html with no session) -->
<body data-page="app">

<!-- ══ OPS BOARD (ops kanban + event-automation cards) ══ -->
<section class="screen active" id="s-opsboard">
  <div class="hdr-plain">
    <div class="hdr-row">
      <div style="display:flex;align-items:center;gap:12px">
        <h1>Task board</h1>
      </div>
      <button class="avatar" id="home-avatar" onclick="switchScreen('more')" aria-label="More">G</button>
    </div>
  </div>
  <div class="content"><div id="opsboard-body"></div></div>
</section>

<!-- ══ MORE / SETTINGS ══ -->
<section class="screen" id="s-more">
  <div class="hdr-plain"><h1>More</h1></div>
  <div class="content">
    <div class="settings-list">
      <div class="account-row" style="cursor:pointer" onclick="openAccountNameModal()">
        <div class="account-avatar" id="acct-avatar">G</div>
        <div style="flex:1"><div class="account-name" id="acct-name">—</div><div class="account-sub" id="acct-sub">—</div></div>
        <span class="settings-label" id="acct-edit-chevron" style="color:var(--text3)">›</span>
      </div>
    </div>

    <details class="settings-section" open>
      <summary class="section-title">Grit BizSuite</summary>
      <div class="settings-list" id="suite-nav-list">
        <a class="settings-row" href="http://localhost:3000" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" data-suite-app="pos">
          <span class="settings-label">Grit POS</span>
          <span class="settings-label" style="color:var(--text3)">&rsaquo;</span>
        </a>
        <a class="settings-row" href="http://localhost:3001" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" data-suite-app="inventory">
          <span class="settings-label">Grit Inventory</span>
          <span class="settings-label" style="color:var(--text3)">&rsaquo;</span>
        </a>
        <a class="settings-row" href="http://localhost:3003" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" data-suite-app="reports">
          <span class="settings-label">Grit Reports</span>
          <span class="settings-label" style="color:var(--text3)">&rsaquo;</span>
        </a>
        <a class="settings-row" href="http://localhost:3004" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" data-suite-app="manpower">
          <span class="settings-label">Grit Manpower</span>
          <span class="settings-label" style="color:var(--text3)">&rsaquo;</span>
        </a>
      </div>
      <p style="font-size:12px;color:var(--text3);margin:6px 4px 14px;line-height:1.4">
        Opens the other Grit BizSuite apps in a new tab. Taskboard has its own
        separate account system, so you'll need to log in there too.
      </p>
    </details>

    <details class="settings-section" open>
      <summary class="section-title">Preferences</summary>
      <div class="settings-list">
        <div class="settings-row">
          <span class="settings-label">Theme</span>
          <div class="seg" id="set-theme" style="max-width:200px">
            <button type="button" data-theme-opt="light" onclick="setThemeSeg('light')">Light</button>
            <button type="button" data-theme-opt="dark" onclick="setThemeSeg('dark')">Dark</button>
            <button type="button" data-theme-opt="auto" onclick="setThemeSeg('auto')">Auto</button>
          </div>
        </div>
      </div>
    </details>

    <div class="settings-list" style="margin-top:16px">
      <div class="settings-row"><span class="settings-label">Version</span><span class="settings-label tnum" id="app-version">0.9.38</span></div>
    </div>

    <button class="btn-logout" onclick="logout()">Log out</button>
  </div>
</section>

<!-- ══ BOTTOM NAV ══ -->
<nav class="nav">
  <button class="nav-btn" id="nav-opsboard" onclick="switchScreen('opsboard')">
    <svg viewBox="0 0 24 24"><path d="M4 6l2 2 3-3"/><path d="M11 6h9"/><path d="M4 13l2 2 3-3"/><path d="M11 13h9"/><path d="M4 20h6"/><path d="M15 20h4M17 18l2 2-2 2"/></svg>
    <span>Task board</span>
  </button>
  <button class="nav-btn" id="nav-more" onclick="switchScreen('more')">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>More</span>
  </button>
</nav>

<!-- ══ ACCOUNT NAME MODAL ══ -->
<div class="modal-overlay" id="modal-account-name" onclick="if(event.target===this)closeAccountNameModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-title">Edit your name</div>
    <div class="form-section">
      <div class="field"><label for="acct-name-input">Your name</label><input type="text" id="acct-name-input"></div>
    </div>
    <button class="btn-submit" onclick="saveAccountName()">Save name</button>
    <button class="btn-danger" style="border-color:var(--border-mid);color:var(--text3)" onclick="closeAccountNameModal()">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="app.js?v=0.9.38"></script>
<script src="dataClient.js?v=0.9.38"></script>
<script src="opsboard.js?v=0.9.38"></script>
<script>
// Suite nav (More screen): plain, non-session-aware links to the other
// three Grit BizSuite apps — taskboard is deliberately excluded from
// @grit/passport SSO (see BACKLOG.md), so there is no session/entitlement
// data here to gate on, just static links. Defaults mirror the localhost
// dev ports in packages/passport/src/nav.ts's DEFAULT_APP_URLS; override
// per-deployment via window.__GRIT_SUITE_URLS = { pos, inventory, reports }
// set before this script runs (same pattern as dataClient.js's
// window.__SIDEKICK_API_BASE).
(function () {
  var urls = Object.assign(
    { pos: 'http://localhost:3000', inventory: 'http://localhost:3001', reports: 'http://localhost:3003', manpower: 'http://localhost:3004' },
    window.__GRIT_SUITE_URLS || {},
  );
  document.querySelectorAll('#suite-nav-list [data-suite-app]').forEach(function (a) {
    var app = a.getAttribute('data-suite-app');
    if (urls[app]) a.href = urls[app];
  });
})();
</script>
