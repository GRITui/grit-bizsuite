<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Grit Taskboard — Log in</title>
<meta name="description" content="Ops kanban with event-driven card automation — task tracking for Grit BizSuite.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF8F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grit Taskboard">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>(function(){var K='sidekick_ui_theme',t=localStorage.getItem(K);if(t==='dark')document.documentElement.dataset.theme='dark';else if(t!=='auto')document.documentElement.dataset.theme='light';})();</script><!-- light by default: set before CSS paints to avoid a flash of the wrong theme -->
<link rel="stylesheet" href="styles.css?v=0.9.38">
<!-- data-page drives boot(): 'login' → bootLogin() (redirects to ./ when already signed in) -->
<body data-page="login">

<div class="auth active" id="s-auth">
  <div class="auth-hero">
    <img class="auth-logo" src="icons/icon.svg" alt="">
    <h1>Grit Taskboard</h1>
    <p>Ops kanban with event-driven card automation.</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="setAuthMode('login')">Log in</button>
      <button class="auth-tab" id="tab-register" onclick="setAuthMode('register')">Create account</button>
    </div>
    <div class="auth-err" id="auth-err" role="alert" aria-atomic="true"></div>
    <div class="auth-field">
      <label for="auth-user">Email or username</label>
      <input type="text" id="auth-user" autocomplete="username" placeholder="you@example.com" autocapitalize="none" inputmode="email">
    </div>
    <div class="auth-field" id="auth-name-wrap" style="display:none">
      <label for="auth-name">Your name</label>
      <input id="auth-name" autocomplete="given-name" placeholder="Alex">
    </div>
    <div class="auth-field">
      <label for="auth-pass">Password</label>
      <input type="password" id="auth-pass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="auth-field" id="auth-confirm-wrap" style="display:none">
      <label for="auth-confirm">Confirm password</label>
      <input type="password" id="auth-confirm" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button class="auth-btn" id="auth-submit" onclick="submitAuth()">Log in</button>
    <button class="auth-btn guest" onclick="loginGuest()">Continue as guest</button>
    <div class="auth-hint"><span id="auth-hint-text"></span><br><br>Local-first · No cloud · Built with Claude</div>
  </div>
</div>

<div class="auth" id="s-guest-choice">
  <div class="auth-hero">
    <img class="auth-logo" src="icons/icon.svg" alt="">
    <h1>Welcome back</h1>
    <p>This device already has guest data saved on it.</p>
  </div>
  <div class="auth-card">
    <button class="auth-btn" onclick="resumeGuest()"><span>Resume as</span> <span id="guest-choice-name"></span></button>
    <button class="auth-btn guest" onclick="startFreshGuest()">Start fresh (erase this guest's data)</button>
    <button class="auth-btn guest" onclick="cancelGuestChoice()">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="app.js?v=0.9.38"></script>
