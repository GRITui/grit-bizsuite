appId: com.gritui.bizsuite
productName: Grit BizSuite
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"

# scripts/build-resources.sh must be run BEFORE `electron-builder` — it
# populates this directory from the web monorepo. Not generated by
# electron-builder itself, hence not listed under `files` above.
extraResources:
  - from: resources/apps
    to: apps
  - from: resources/postgres-macos-arm64
    to: postgres
  - from: resources/prisma-tools
    to: prisma-tools

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  # Unsigned-first per this build's default (see electron-lab-scope.md /
  # the session's own scoping notes) — flip to true and provide
  # `identity`/notarization env vars once you have an Apple Developer
  # Program membership. `entitlements` is still required even while
  # unsigned, because Electron's own Info.plist template opts new bundles
  # into aspects of the hardened runtime unconditionally on recent macOS.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: "Grit BizSuite ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# afterSign hook (notarization) intentionally omitted — see README.md's
# "Code signing & notarization" section for what to add once you have
# Developer ID credentials. Without it, first launch requires the user to
# right-click → Open (Gatekeeper) since the .dmg is unsigned.
